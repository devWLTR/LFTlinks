<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LFT Gym App</title>
<meta name="theme-color" content="#0f0f1a">
<style>
:root {
  --bg-1: #0f0f1a;
  --bg-2: #1a1a2e;
  --accent: #7c5cff;
  --accent-2: #ff5c9e;
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-hover: rgba(255, 255, 255, 0.1);
  --text: #ffffff;
  --text-muted: #a0a0b8;
  --border: rgba(255, 255, 255, 0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 20px;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 20% 20%, rgba(124, 92, 255, 0.15), transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(255, 92, 158, 0.12), transparent 50%);
  pointer-events: none;
  z-index: 0;
}
.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}
.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid transparent;
  background: linear-gradient(var(--bg-2), var(--bg-2)) padding-box,
              linear-gradient(135deg, var(--accent), var(--accent-2)) border-box;
  box-shadow: 0 8px 32px rgba(124, 92, 255, 0.3);
}
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; }
.bio {
  color: var(--text-muted);
  font-size: 0.95rem;
  text-align: center;
  max-width: 320px;
  line-height: 1.5;
}
.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.link-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 20px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  color: var(--text);
  text-decoration: none;
  font-size: 1rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  backdrop-filter: blur(10px);
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
  text-align: left;
}
.link-btn:hover {
  background: var(--card-hover);
  border-color: rgba(124, 92, 255, 0.4);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(124, 92, 255, 0.15);
}
.link-btn:active { transform: translateY(0); }
.link-icon { font-size: 1.4rem; width: 32px; text-align: center; flex-shrink: 0; }
.link-label { flex: 1; }
.link-arrow { color: var(--text-muted); transition: transform 0.2s ease; }
.link-btn:hover .link-arrow { transform: translateX(4px); color: var(--accent); }
footer { color: var(--text-muted); font-size: 0.8rem; margin-top: 8px; opacity: 0.6; }
</style>
</head>
<body>
<div class="container">
  <img id="avatar" class="avatar" src="" alt="LFT Logo">
  <h1 id="name"></h1>
  <p id="bio" class="bio"></p>
  <div id="links" class="links"></div>
  <footer id="footer"></footer>
</div>

<script>
/* ============================================
   ✏️ MUOKKAA TÄSTÄ – KAIKKI ASETUKSET TÄSSÄ
   ============================================ */
const CONFIG = {
  name: "LFT Gym App",
  bio: "Seuraa meitä somessa ja lue lisää sovelluksesta!",
  // Tässä on nyt tyylikäs kuntosalikuva. Jos haluat oman logon, 
  // voit ladata sen GitHubiin ja vaihtaa tähän tiedostonimen (esim. "logo.jpg")
  avatar: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=300&auto=format&fit=crop",
  footer: "© 2026 LFT Gym App",

  links: [
    {
      label: "YouTube",
      icon: "▶️",
      web: "https://www.youtube.com/@Lftgymapp",
      ios: "youtube://www.youtube.com/@Lftgymapp",
      android: "youtube://www.youtube.com/@Lftgymapp",
      androidPackage: "com.google.android.youtube"
    },
    {
      label: "TikTok",
      icon: "🎬",
      web: "https://www.tiktok.com/@lftgymapp",
      ios: "snssdk1128://user/profile/lftgymapp",
      android: "snssdk1128://user/profile/lftgymapp",
      androidPackage: "com.zhiliaoapp.musically"
    },
    {
      label: "Instagram",
      icon: "📸",
      web: "https://www.instagram.com/getlft/",
      ios: "instagram://user?username=getlft",
      android: "instagram://user?username=getlft",
      androidPackage: "com.instagram.android"
    },
    {
      label: "App Info + Privacy Policy",
      icon: "📄",
      // Tämä avaa aina nettisivun, koska kyseessä ei ole sovellus
      web: "https://sites.google.com/view/applft?usp=sharing"
    }
  ]
};

/* ============================================
   ⚙️ ÄLÄ MUOKKAA TÄSTÄ ALASPÄIN
   ============================================ */
document.getElementById('avatar').src = CONFIG.avatar;
document.getElementById('name').textContent = CONFIG.name;
document.getElementById('bio').textContent = CONFIG.bio;
document.getElementById('footer').textContent = CONFIG.footer;

const linksContainer = document.getElementById('links');
CONFIG.links.forEach(link => {
  const btn = document.createElement('button');
  btn.className = 'link-btn';
  btn.innerHTML = `
    <span class="link-icon">${link.icon || '🔗'}</span>
    <span class="link-label">${link.label}</span>
    <span class="link-arrow">→</span>
  `;
  btn.addEventListener('click', () => openLink(link));
  linksContainer.appendChild(btn);
});

function openLink(link) {
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);

  // Työpöytä tai ei app-schemeä → verkkosivu
  if ((!isIOS && !isAndroid) || (!link.ios && !link.android)) {
    window.open(link.web, '_blank', 'noopener');
    return;
  }

  // Android: intent:// + automaattinen fallback
  if (isAndroid && link.android && link.androidPackage) {
    const scheme = link.android.split('://')[0];
    const path = link.android.replace(/^[a-z0-9]+:\/\//, '');
    const intentUrl = `intent://${path}#Intent;scheme=${scheme};package=${link.androidPackage};S.browser_fallback_url=${encodeURIComponent(link.web)};end`;
    window.location.href = intentUrl;
    return;
  }

  // iOS: custom scheme + visibility timeout
  if (isIOS && link.ios) {
    openIOSApp(link.ios, link.web);
    return;
  }

  window.open(link.web, '_blank', 'noopener');
}

function openIOSApp(scheme, webUrl) {
  const start = Date.now();
  let didHide = false;
  const onVisibility = () => { if (document.hidden) didHide = true; };

  document.addEventListener('visibilitychange', onVisibility);
  window.addEventListener('pagehide', onVisibility);

  window.location.href = scheme;

  setTimeout(() => {
    document.removeEventListener('visibilitychange', onVisibility);
    window.removeEventListener('pagehide', onVisibility);
    if (!didHide && !document.hidden && (Date.now() - start) < 2500) {
      window.location.href = webUrl;
    }
  }, 1200);
}
</script>
</body>
</html>
